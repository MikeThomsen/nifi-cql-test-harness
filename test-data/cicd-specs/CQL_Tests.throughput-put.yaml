# Write-path throughput check for the "PutCQLRecord Test" process group, exported on its own
# as CQL_Tests.PutCQLRecord_Test.json.
#
# Split from the original CQL_Tests.throughput.yaml, which exercised two groups of CQL_Tests at
# once: nifi-cicd-test-runner runs one process group per flow, so the write and read checks are
# separate specs with separate flows. Run this one first; the read check in
# CQL_Tests.throughput-query.yaml queries the rows it writes.
#
#   putcqlrecord_success   FlowFiles through PutCQLRecord's success relationship. Delta = 1,
#                          so this is a raw FlowFile count, not a record count.
#   invalid_records        Fed by ValidateRecord's invalid relationship. Asserted at zero so
#                          records silently failing validation cannot pass for a healthy run.
#
# PutCQLRecord auto-terminates failure and retry, so a failed write is dropped without a
# trace; putcqlrecord_success staying below its bound is the only signal.
#
# CQL_PASSWORD is the only parameter the export omits. The value below matches the local
# nifi-scylla container. In CI, delete the parameters block and use a provider instead:
#
#   parameterProviders:
#     - name: env
#       type: org.apache.nifi.stateless.parameter.EnvironmentVariableParameterValueProvider
#
# The flow has no input ports; it is source driven. GetFile polls /tmp/messages and DELETES
# what it reads, so stage a copy before every run (from the test-data directory):
#
#   rm -rf /tmp/messages && mkdir -p /tmp/messages
#   cp -r message-conversations/test-data-2026082* /tmp/messages/
#
# Run (from the test-data directory):
#
#   java -jar nifi-cicd-test-runner.jar run \
#       --spec cicd-specs/CQL_Tests.throughput-put.yaml --nar-dir <nar-dir>

flow: ../nifi-flows/CQL_Tests.PutCQLRecord_Test.json

nars:
  - org.apache.nifi:nifi-standard-nar
  - org.apache.nifi:nifi-update-attribute-nar
  - org.apache.nifi:nifi-record-serialization-services-nar
  - org.apache.nifi:nifi-registry-nar
  - org.apache.nifi:nifi-cql-nar
  - org.apache.nifi:nifi-cql-distributedmapcache-service-nar
  - org.apache.nifi:nifi-scylladb-session-provider-service-nar

parameters:
  Cassandra Context:
    CQL_PASSWORD: cassandra

# Hold the engine open for 35 seconds measured from flow-up.
minRuntime: 30 sec
minRuntimeGrace: 5 sec

# Let one trigger draw in a batch rather than the default single FlowFile.
transactionThresholds:
  flowfiles: 120
  time: 30 sec

cases:
  # repeatFor keeps triggering for the whole window.
  - name: sustained CQL write throughput
    repeatFor: 30 sec
    expect:
      counters:
        putcqlrecord_success:
          atLeast: 110
        invalid_records: 0
